<!DOCTYPE HTML>
<html>
<meta charset="utf-8">
<head>
    <title>Analog Clock</title>
    <script>
        let i = 0
        let r = 'u'
         const updateTime=()=> {
            var secondhand = document.getElementById("secondhand");
             if (r === 'u') {
                 i--
             }else {
                 i++
             }
            // 设置这些元素的SVG属性，将它们移动到钟面上
            secondhand.setAttribute("transform", "rotate(" + i + ",50,50)");
            // 每秒钟更新下时钟显示时间
            setTimeout(updateTime, 1);
        }
    </script>
    <style>
        #clock {
            stroke: black;
            stroke-linecap: round;
            fill: #eef;
        }
        #face { stroke-width: 2px;}
        #ticks { stroke-width: 2px; }
        #minutehand {stroke-width: 2px;}
        #secondhand{stroke-width: 1px;}
        #numbers {
            font-family: sans-serif; font-size: 7pt; font-weight: bold;
            text-anchor: middle; stroke: none; fill: black;
        }
    </style>
</head>
<body onload="updateTime()">
<!-- viewBox是坐标系，width和height是指屏幕大小 -->
<svg id="clock" viewBox="0 0 100 100" width="500" height="500">
    <circle id="face" cx="50" cy="50" r="45"/> <!-- 钟缅 -->
    <g id="ticks">        <!-- 12小时的刻度 -->
        <line x1='50' y1='5.000' x2='50.00' y2='10.00'/>
    </g>
        <line id="secondhand" x1="50" y1="50" x2="50" y2="11"/>
</svg>
</body>
</html>
